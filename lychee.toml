# Configuration for the lychee link checker (https://lychee.cli.rs/)
max_redirects = 10
max_retries = 3
retry_wait_time = 5
timeout = 30
max_concurrency = 8
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
accept = ["200..=299", "429"]
include_mail = false
# Do not cache failures, so a temporary outage is re-checked on the next run.
cache_exclude_status = ["400..=599"]

exclude = [
  # LinkedIn answers automated requests with HTTP 999.
  '^https://www\.linkedin\.com/',
]
